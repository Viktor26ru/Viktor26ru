version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    container_name: messenger_mvp_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-messenger_mvp}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      # Loopback only: do not publish Postgres on all interfaces.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata_messenger_mvp:/var/lib/postgresql/data

volumes:
  pgdata_messenger_mvp:
