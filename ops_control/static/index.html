<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0b1220">
  <title>ЦОВ · Ops</title>
  <style>
    :root {
      --bg:#0b1220; --card:#151d2e; --line:#243049; --ok:#3dd68c; --bad:#ff6b6b;
      --warn:#ffc857; --muted:#8b9bb4; --text:#e8eef8; --accent:#6ea8fe;
    }
    * { box-sizing:border-box; }
    body { margin:0; font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); }
    header { padding:16px 16px 8px; position:sticky; top:0; background:linear-gradient(#0b1220,#0b1220ee); z-index:2; }
    h1 { font-size:18px; margin:0 0 4px; }
    .sub { color:var(--muted); font-size:12px; }
    .grid { display:grid; gap:12px; padding:12px 16px 96px; }
    @media (min-width:900px) { .grid { grid-template-columns:1fr 1fr; } }
    .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; }
    .row { display:flex; justify-content:space-between; gap:8px; align-items:baseline; }
    .ok { color:var(--ok); } .bad { color:var(--bad); } .warn { color:var(--warn); } .muted { color:var(--muted); }
    .pills { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
    .pill { background:#0b1220; border:1px solid var(--line); border-radius:999px; padding:3px 8px; font-size:12px; }
    a { color:var(--accent); }
    pre { white-space:pre-wrap; font-size:12px; color:#c9d4e8; margin:8px 0 0; }
    .cmd { position:fixed; left:0; right:0; bottom:0; padding:10px 12px calc(10px + env(safe-area-inset-bottom)); background:#0b1220f2; border-top:1px solid var(--line); display:flex; gap:8px; }
    input, button { font:inherit; }
    input { flex:1; background:#151d2e; color:var(--text); border:1px solid var(--line); border-radius:10px; padding:10px; }
    button { background:var(--accent); color:#071018; border:0; border-radius:10px; padding:10px 14px; font-weight:700; }
    ul { margin:8px 0 0; padding-left:18px; }
    .bar { height:6px; background:#0b1220; border-radius:99px; overflow:hidden; margin-top:6px; }
    .bar > i { display:block; height:100%; background:var(--ok); }
    .bar.warn > i { background:var(--warn); }
    .bar.bad > i { background:var(--bad); }
  </style>
</head>
<body>
  <header>
    <h1>ЦОВ · независимый мониторинг</h1>
    <div class="sub" id="meta">загрузка…</div>
  </header>
  <div class="grid" id="root"></div>
  <form class="cmd" id="form">
    <input id="q" autocomplete="off" placeholder="команда: статус / рестарт x5 collector">
    <button type="submit">OK</button>
  </form>
  <script>
    const $ = (id) => document.getElementById(id);
    const pctClass = (n) => n >= 85 ? "bad" : n >= 70 ? "warn" : "";
    const fmtBytes = (n) => !n ? "—" : n > 1e9 ? (n/1e9).toFixed(1)+"G" : (n/1e6).toFixed(0)+"M";
    function card(p) {
      const s = p.snapshot || {};
      const ok = s.ok;
      const disk = (s.disks || []).find(d => d.mount === "/") || {};
      const mem = s.mem || {};
      const load = (s.load || []).join(" / ");
      const up = p.uptime24 == null ? "—" : (p.uptime24*100).toFixed(1) + "%";
      const units = Object.entries(s.units || {}).map(([u,st]) => `<span class="pill ${st==="active"?"ok":"bad"}">${st} ${u.replace(".service","")}</span>`).join("");
      const http = (s.http || []).map(h => `<a href="${h.url}" target="_blank">${h.title || h.id}</a> <span class="muted">${h.code} ${h.ms}мс</span>`).join("<br>");
      const mx = s.max || {};
      const extra = s.extra || {};
      const extraBits = Object.entries(extra).filter(([k]) => !String(k).includes("error")).map(([k,v]) => `${k}: ${v}`).join(" · ");
      const barC = pctClass(disk.pct || 0);
      return `<section class="card">
        <div class="row"><strong>${p.title}</strong><span class="${ok?"ok":"bad"}">${ok?"норма":"сбой"}</span></div>
        <div class="muted">${p.host} · ${p.short} · аптайм 24ч ${up}</div>
        <div class="pills">
          <span class="pill">load ${load || "—"}</span>
          <span class="pill">RAM ${mem.pct ?? "—"}%</span>
          <span class="pill">диск ${disk.pct ?? "—"}%</span>
          <span class="pill">LLM ${p.llm_model || "—"}</span>
        </div>
        <div class="bar ${barC}"><i style="width:${disk.pct||0}%"></i></div>
        <div class="pills">${units || '<span class="pill">нет юнитов</span>'}</div>
        <div style="margin-top:8px">${http || ""}</div>
        <div class="muted" style="margin-top:8px">MAX ${mx.ok ? (mx.name+" @"+(mx.username||"")) : (mx.error || "нет")}</div>
        <div class="muted">${extraBits}</div>
        ${(p.notes||[]).map(n => `<div class="muted">· ${n}</div>`).join("")}
        ${s.error ? `<pre>${s.error}</pre>` : ""}
      </section>`;
    }
    function render(data) {
      const t = new Date((data.generated_at||0)*1000).toLocaleString("ru-RU");
      $("meta").textContent = `снимок ${t} · независимо от прод-хостов · TG @Crazynewaibot`;
      const inc = (data.open_incidents||[]).map(i => `<li>#${i.id} ${i.project} ${i.target}: ${i.summary}</li>`).join("") || "<li>открытых инцидентов нет</li>";
      const cmds = (data.commands||[]).slice(0,6).map(c => `<div class="muted">${c.source} ${c.actor}: ${c.text}</div>`).join("");
      const cd = data.cursordev || {};
      $("root").innerHTML = data.projects.map(card).join("") + `
        <section class="card">
          <div class="row"><strong>Cursordev</strong><span class="${cd.ok?"ok":"bad"}">${cd.ok?"норма":"нет данных"}</span></div>
          <div class="muted">${cd.host || "195.209.219.8"} · зеркала x5 / chizhik / project-manager</div>
          <div class="pills"><span class="pill">load ${(cd.load||[]).join(" / ")}</span><span class="pill">RAM ${(cd.mem||{}).pct ?? "—"}%</span></div>
        </section>
        <section class="card">
          <strong>Инциденты</strong>
          <ul>${inc}</ul>
          <strong style="display:block;margin-top:10px">Последние команды</strong>
          ${cmds || '<div class="muted">пока пусто</div>'}
        </section>`;
    }
    async function load() {
      const r = await fetch("/api/snapshot", { credentials:"same-origin" });
      if (!r.ok) { $("meta").textContent = "нужен ключ дашборда (?key=)"; return; }
      render(await r.json());
    }
    $("form").onsubmit = async (e) => {
      e.preventDefault();
      const text = $("q").value.trim();
      if (!text) return;
      const r = await fetch("/api/command", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({text}), credentials:"same-origin" });
      const data = await r.json();
      alert(data.result || "ok");
      $("q").value = "";
      load();
    };
    load();
    setInterval(load, 15000);
  </script>
</body>
</html>
